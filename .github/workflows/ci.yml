name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Gradle test selector (e.g. test --tests FooTest); empty runs the full build'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('assemble {0}', inputs.test-filter) || 'build' }}
      - name: Test results summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for f in sorted(glob.glob("build/test-results/*/*.xml")):
              r = ET.parse(f).getroot()
              c = {k: int(r.get(k, 0)) for k in tot}
              for k in tot: tot[k] += c[k]
              print(f"{r.get('name')}: tests={c['tests']} failures={c['failures']} errors={c['errors']} skipped={c['skipped']}")
              for tc in r.iter("testcase"):
                  s = tc.find("skipped")
                  if s is not None:
                      print(f"  SKIPPED {tc.get('classname')}.{tc.get('name')}: {s.get('message', 'no message')}")
          print(f"TOTAL: tests={tot['tests']} passed={tot['tests']-tot['failures']-tot['errors']-tot['skipped']} failures={tot['failures']} errors={tot['errors']} skipped={tot['skipped']}")
          PY
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport
      - name: Build release jar
        if: matrix.java == '8'
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jar
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: junrar-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
